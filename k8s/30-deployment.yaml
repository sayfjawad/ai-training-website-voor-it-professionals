apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-governance
  namespace: stichting
  labels:
    app: ai-governance
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO PVC — don't run two pods against it at once
  selector:
    matchLabels:
      app: ai-governance
  template:
    metadata:
      labels:
        app: ai-governance
    spec:
      # Pin to c4130 (tailnet 100.64.0.14), same node as the other web apps.
      # Public TLS edge is nginx on vmi2702091, which reverse-proxies
      # governance.stichtingduurzaamai.nl -> http://100.64.0.14:5055 over the tailnet.
      nodeSelector:
        kubernetes.io/hostname: c4130
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/sayfjawad/ai-governance-training:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
              hostPort: 5055 # reachable over the tailnet at 100.64.0.14:5055
          envFrom:
            - secretRef:
                name: ai-governance-env
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-governance-data
