apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-governance
  namespace: stichting
  labels:
    app: ai-governance
spec:
  replicas: 1
  strategy:
    type: Recreate # single RWO PVC — don't run two pods against it at once
  selector:
    matchLabels:
      app: ai-governance
  template:
    metadata:
      labels:
        app: ai-governance
    spec:
      # Pin to the public control-plane VPS (only node with a public IP).
      nodeSelector:
        kubernetes.io/hostname: vmi3419075
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: app
          image: ghcr.io/sayfjawad/ai-governance-training:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          envFrom:
            - secretRef:
                name: ai-governance-env
          env:
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-governance-data
